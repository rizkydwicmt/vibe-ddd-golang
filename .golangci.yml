version: "2"

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly
  build-tags:
    - integration

linters:
  default: none
  enable:
    - misspell
    - whitespace
    - gocyclo
    - funlen
    - lll
    - nilerr # returns nil after checking err != nil
    - nilnil # simultaneous nil error and nil value
  settings:
    funlen:
      lines: 80
      statements: 50
    gocyclo:
      min-complexity: 15
    lll:
      # 140 fits the idiomatic one-line envelope Send and gRPC handler signatures.
      line-length: 140
    misspell:
      locale: US
  exclusions:
    paths:
      - internal/pkg/testutil
      - internal/server/api/docs
      - .*\.pb\.go$
      - .*_gen\.go$
      - .*mock.*\.go$
    rules:
      - path: main\.go
        linters:
          - funlen
          - gocyclo
      # Infra libraries carry pre-existing complexity; domain code under
      # internal/application stays fully gated.
      - path: internal/pkg/
        linters:
          - funlen
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - vibe-ddd-golang
  exclusions:
    paths:
      - .*\.pb\.go$
      - internal/server/api/docs

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
